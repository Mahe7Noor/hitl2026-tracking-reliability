[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-tracking-reliability-al"
version = "0.1.0"
description = "Active learning for GT-matched versus unmatched overhead fisheye tracking detections"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
